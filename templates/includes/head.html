{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="profile" href="https://gmpg.org/xfn/11">
<title>{% block title %}Hapa ni Nyumbani - Nelson Mandela Radio{% endblock %}</title>
<meta name='robots' content='max-image-preview:large' />
<link rel='dns-prefetch' href='//fonts.googleapis.com' />


<!-- Styles -->
<link rel='stylesheet' id='astra-theme-css' href='https://fonts.googleapis.com/css?family=Raleway%3A500%2C%7CFjalla+One%3A400%2C%7CPoppins%3A700&display=fallback' media='all' />
<link rel='stylesheet' id='main-css' href="{% static 'css/main.css' %}" media='all' />
<link rel='stylesheet' id='responsive-css' href="{% static 'css/responsive.css' %}" media='all' />

<!-- Elementor -->
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/elementor/3.33.2/css/frontend.min.css' media='all' />
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/elementor/3.33.2/css/widget-heading.min.css' />
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/elementor/3.33.2/css/widget-social-icons.min.css' />

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Favicon -->
<link rel="icon" href="{% static 'images/favicon-32x32.png' %}" sizes="32x32">
<link rel="icon" href="{% static 'images/favicon-192x192.png' %}" sizes="192x192">
<link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">

<style>
:root {
    --ast-global-color-0: #f3c242;
    --ast-global-color-1: #f2b827;
    --ast-global-color-2: #ffffff;
    --ast-global-color-3: rgba(255,255,255,0.8);
    --ast-global-color-4: #000000;
    --ast-global-color-5: #131313;
    --ast-global-color-6: #F2F5F7;
    --ast-global-color-7: #131313;
    --ast-global-color-8: #000000;
    --ast-border-color: #dddddd;
}
</style>

{% block page_styles %}{% endblock %}
