{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Nelson Mandela Radio — Science for Life{% endblock %}</title>
<meta name="description" content="Nelson Mandela Radio — bridging academia, industry, and society. Listen live across Tanzania.">
<meta name='robots' content='max-image-preview:large' />
<link rel='dns-prefetch' href='//fonts.googleapis.com' />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Stylesheets -->
<link rel='stylesheet' href="{% static 'css/main.css' %}" media='all' />
<link rel='stylesheet' href="{% static 'css/responsive.css' %}" media='all' />

<!-- Favicon -->
<link rel="icon" href="{% static 'images/logo.png' %}">

{% block page_styles %}{% endblock %}
