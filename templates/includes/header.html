{% load static %}
<header class="site-header" id="masthead">

  <!-- ── DESKTOP HEADER ── -->
  <div id="ast-desktop-header">
    <div class="ast-primary-header-bar">
      <div class="ast-builder-grid-row">

        <!-- Logo -->
        <div class="site-header-primary-section-left">
          <a href="{% url 'home' %}" rel="home">
            <img src="{% static 'images/logo.png' %}" class="custom-logo" alt="Nelson Mandela Radio" width="64" height="64">
          </a>
        </div>

        <!-- Navigation -->
        <div class="site-header-primary-section-right">
          <nav id="primary-site-navigation-desktop" aria-label="Site Navigation">
            <ul class="main-header-menu">
              <li class="menu-item {% if request.path == '/' %}current-menu-item{% endif %}">
                <a href="{% url 'home' %}">Home</a>
              </li>
              <li class="menu-item {% if 'about' in request.path %}current-menu-item{% endif %}">
                <a href="{% url 'about' %}">Who We Are</a>
              </li>
              <li class="menu-item {% if 'radio' in request.path %}current-menu-item{% endif %}">
                <a href="{% url 'live_stream' %}">Listen Live</a>
              </li>
              <li class="menu-item {% if 'contact' in request.path %}current-menu-item{% endif %}">
                <a href="{% url 'contact' %}">Contact</a>
              </li>
              <li>
                <a href="{% url 'live_stream' %}" class="btn btn-primary" style="padding:10px 22px;font-size:12px;">
                  <i class="fas fa-broadcast-tower"></i> On Air
                </a>
              </li>
            </ul>
          </nav>
        </div>

      </div>
    </div>
  </div>

  <!-- ── MOBILE HEADER ── -->
  <div id="ast-mobile-header" class="ast-mobile-header-wrap">
    <div class="ast-primary-header-bar">
      <div class="ast-builder-grid-row">
        <div>
          <a href="{% url 'home' %}" rel="home">
            <img src="{% static 'images/logo.png' %}" class="custom-logo" alt="Nelson Mandela Radio" width="70" height="40">
          </a>
        </div>
        <div>
          <button type="button" class="menu-toggle" id="mobile-menu-toggle" aria-expanded="false">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="ast-mobile-header-content" id="mobile-menu-content">
      <nav aria-label="Mobile Navigation">
        <ul class="main-header-menu">
          <li class="menu-item"><a href="{% url 'home' %}">Home</a></li>
          <li class="menu-item"><a href="{% url 'about' %}">Who We Are</a></li>
          <li class="menu-item"><a href="{% url 'live_stream' %}">Listen Live</a></li>
          <!-- <li class="menu-item"><a href="{% url 'programs' %}">Programs</a></li>
          <li class="menu-item"><a href="{% url 'news_list' %}">News</a></li> -->
          <li class="menu-item"><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
      </nav>
    </div>
  </div>

</header>
